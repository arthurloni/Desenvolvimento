<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/Front-end/CSS/EsqueciSenha/RedefinirSenha.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedefinirSenha</title>
</head>
<body>
    
    <div class="BlocoGeral">

        <h1 class="TituloRedefinir">Redefinição de senha.</h1>
        <p class="PrgRedefinir">Preencha abaixo com sua senha nova.</p>

        <form class="BlocoForm">
            <h3 class="TituloSenha1">Senha</h3>

            <div class="BlocoSenha1"> 
                <input class="Senha1" type="password" id="Senha1" name="Senha1" required> <!-- Tipo especifico para Senha -->
                <button type="button" class="BotaoOlho" onclick="mostrarSenha('Senha1', this)"> <!-- Froma de mostrar senha, utilizando função criada via Js -->
                    <img src="/Front-end/IMG/MostrarSenha/OlhoSenha.png" alt="Mostrar senha">
                </button>
            </div>

            <h3 class="TituloSenha2">Confirmar Senha</h3>

            <div class="BlocoSenha2">
                <input class="Senha2" type="password" id="Senha2" name="Senha2" required> <!-- Tipo especifico para Senha -->
                <button type="button" class="BotaoOlho" onclick="mostrarSenha('Senha2', this)"> <!-- Froma de mostrar senha, utilizando função criada via Js -->
                    <img src="/Front-end/IMG/MostrarSenha/OlhoSenha.png" alt="Mostrar senha">
                </button>
            </div>

            <button class="RedefinirSenha" type="submit">Redefinir</button>

        </form>

    </div>

</body>
</html>
