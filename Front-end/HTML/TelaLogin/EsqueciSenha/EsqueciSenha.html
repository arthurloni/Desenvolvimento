<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/Front-end/CSS/TelaLogin/EsqueciSenha/EsqueciSenha.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EsqueciSenha</title>
</head>
<body>
    
    <div class="BlocoGeral">

        <h1 class="TituloLogin">Esqueceu senha?</h1>
        <p class="PrgLogin">Coloque suas Informações abaixo para redefinir.</p>

        <form class="BlocoForm">
            <h3 class="TituloUser">Usuario</h3>

            <div class="BlocoUser"> 
                <input class="BlocoInfoUser" type="text" type="text" id="User" name="User" required> <!-- Tipo especifico para usuario -->
            </div>
            
            <h3 class="TituloEmail">E-mail</h3>

            <div class="BlocoEmail">
                <input class="BlocoInfoEmail" type="email" id="email" name="email" required> <!-- Tipo especifico para email -->
            </div>

            <button class="BotaoEnviarCod" type="submit">Enviar</button>

            <div id="CodigoEmail">
                <script>
                    const elemento = document.getElementById('CodigoEmail')
                    if (elemento) {
                        elemento.textContent = "Um codigo foi enviado ao seu E-mail."
                        elemento.style.color = "#191970"
                        elemento.style.textAlign = "center"
                        elemento.style.marginTop = "10px"
                        elemento.style.fontSize = "18px"
                    }
                </script>
            </div>
            
        </form>

    </div>

</body>
</html>
