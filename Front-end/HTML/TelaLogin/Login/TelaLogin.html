<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/Front-end/CSS/TelaLogin/Login/TelaLogin.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TelaLogin</title>
</head>
<body>

    <!-- 
        h1,h2,h3,h4,h5,h6 = Títulos
        p = Parágrafo
        div = Bloco
        class = Classe
        input = Campo de entrada de dados
        type = Tipo de entrada de dados
        button = Botão
        a = Link
        span = separador de texto
    -->

    <div class="BlocoGeral">

        <h1 class="TituloLogin">Faça seu login.</h1>
        <p class="PrgLogin">Coloque suas Informações abaixo.</p>

        <form class="BlocoFormLogin">

            <h3 class="TituloUser">Usuario</h3>

            <div class="BlocoUser">
                <input class="BlocoInfoUser" type="text" id="User" name="User" required> <!-- Tipo especifico para usuario -->
            </div>
            
            <h3 class="TituloSenha">Senha</h3>
            
            <div class="BlocoSenha">
                <input class="BlocoInfoSenha" type="password" id="BlocoInfoSenha" name="BlocoInfoSenha" required> <!-- Tipo especifico para senha -->
            </div>

            <a class="EsqueciSenha" href="/Front-end/HTML/TelaLogin/EsqueciSenha/EsqueciSenha.html">Esqueci minha senha</a>
            
            <button class="BotaoEntrar">ENTRAR</button>

        </form>

        <a class="CriarConta" href="/Front-end/HTML/TelaLogin/Cadastro/TelaCadastro.html">
            <span class="Text1">Não tem conta ainda?</span>
            <span class="Text2">Crie uma conta</span>
        </a>

    </div>

</body>
</html>
