<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/TelaLogin.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TelaLogin</title>
</head>
<body>

    <div class="BlocoGeral">
        <h1 class="TituloLogin">Faça seu login</h1>
        <p class="PrgLogin">Coloque suas Informações abaixo.</p>
        <h3 class="TituloUser">Usuario</h3>
        <div class="BlocoUser">
            <input class="BlocoInfoUser" type="text">
        </div>

        <h3 class="TituloSenha">Senha</h3>
        <div class="BlocoSenha">
            <input class="BlocoInfoSenha" type="text">
        </div>
        
        <div class="lembreMe">
            <input class="CaixaLembrar" type="checkbox">
            <label for="CaixaLembrar">Lembrar-me</label>
        </div>

        <button class="BotaoEntrar">ENTRAR</button>

    </div>

</body>
</html>
